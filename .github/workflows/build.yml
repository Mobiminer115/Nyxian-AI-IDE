name: Build iOS App

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version
        run: |
          VERSION=$(awk -F'=' '/^[[:space:]]*VERSION[[:space:]]*=/ {gsub(/[[:space:]]/,"",$2); print $2; exit}' Config.xcconfig)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Dependencies
        run: |
          set -e
          brew install ldid dpkg libarchive

      - name: Setup
        run: |
          set -e

      - name: Build Nyxian
        timeout-minutes: 1200
        run: |
          set -e
          CHECK_DEPS=0 make all

      - name: Upload Nyxian
        uses: actions/upload-artifact@v4
        with:
          name: Nyxian.ipa
          path: Nyxian.ipa

      # CI trigger marker: keep this workflow on the same build path while
      # allowing us to verify the current main branch after feature merges.
      - name: CI verification marker
        run: echo "Nyxian AI agent CI verification"